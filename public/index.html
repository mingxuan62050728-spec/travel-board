<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>足迹板 · 旅行毛毡地图</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>

<!-- 左下角唯一的「人物头像」按钮 -->
<button id="avatar-btn" title="菜单 / 我的足迹板">👤</button>

<!-- 抽屉菜单（点头像弹出） -->
<div id="drawer-backdrop" hidden></div>
<aside id="drawer">
  <div id="drawer-head">
    <button id="drawer-avatar" class="d-avatar" title="更改头像">👤</button>
    <div id="drawer-id">
      <div id="drawer-name">未登录</div>
      <div id="drawer-sub">登录后即可点亮、评分、贴照片</div>
    </div>
    <div id="drawer-btns">
      <button class="btn small primary" data-act="login-open" id="drawer-login">登录 / 注册</button>
      <button class="btn small" data-act="logout" id="drawer-logout" hidden>退出</button>
    </div>
  </div>
  <div id="search-box">
    <input id="search-input" type="text" placeholder="🔍 搜索地名，如：东京塔 / 埃菲尔铁塔" autocomplete="off">
    <div id="search-results"></div>
  </div>
  <div id="drawer-settings">
    <div class="ds-row">
      <span class="ds-label">地图语言</span>
      <div class="seg">
        <button data-lang="zh" class="on">中文</button>
        <button data-lang="en">English</button>
      </div>
    </div>
    <div class="ds-row">
      <span class="ds-label">地图源</span>
      <div class="seg">
        <button data-source="wiki" class="on">Wikimedia</button>
        <button data-source="esri">Esri</button>
        <button data-source="osm">OSM</button>
      </div>
    </div>
  </div>
  <nav id="tabs">
    <button data-tab="places" class="on">地点</button>
    <button data-tab="tracks">轨迹</button>
    <button data-tab="routes">路线</button>
    <button data-tab="photos">照片</button>
    <button data-tab="friends">好友</button>
    <button data-tab="stats">统计</button>
  </nav>
  <div id="panel"></div>
</aside>

<!-- 右下角：添加地点 -->
<button id="add-btn" title="添加地点（点地图钉下）">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- 右上角控制：分享 / 搜索 / 定位 / 底图 / 纯净 -->
<div id="map-controls">
  <button data-act="share-board" title="分享当前视角"><svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A3 3 0 1 0 15 5c0 .24.04.47.09.7L8.04 9.81A3 3 0 1 0 8.04 14.19l7.12 4.16c-.05.21-.08.43-.08.65A3 3 0 1 0 18 16.08z"/></svg></button>
  <button id="search-btn" title="搜索地名">🔍</button>
  <button id="friends-btn" title="好友">👥</button>
  <button id="locate-btn" title="定位到我的位置">📍</button>
  <button id="basemap-btn" title="切换标准 / 卫星地图">🗺️</button>
  <button id="clean-btn" title="纯净模式（只看地图）">👁</button>
</div>

<!-- 绘制轨迹时地图右侧的独立按钮 -->
<div id="draw-tools" hidden>
  <div id="draw-info">0 点</div>
  <button data-act="track-undo" title="撤回上一步">↶</button>
  <button data-act="track-clear" title="删除全部">🗑</button>
  <button data-act="record-save" title="保存轨迹">💾</button>
  <button data-act="record-cancel" title="退出绘制">✕</button>
</div>

<div id="mode-tip" hidden></div>

<div id="modal-root" hidden></div>
<div id="lightbox" hidden>
  <div class="pv">
    <button class="pv-close" id="lb-close">✕</button>
    <div class="pv-left" id="pv-left"></div>
    <div class="pv-right">
      <div class="pv-toolbar">
        <div class="seg" id="pv-imgfilter">
          <button data-imgfilter="all" class="on">全部图片</button>
          <button data-imgfilter="mine">我上传的</button>
          <button data-imgfilter="others">其他人的</button>
        </div>
        <div class="pv-nav">
          <button id="pv-prev" title="上一张">‹</button>
          <span id="pv-count"></span>
          <button id="pv-next" title="下一张">›</button>
        </div>
      </div>
      <div class="pv-imgwrap">
        <img id="pv-img" alt="">
        <button class="pv-arrow left" id="pv-arrow-prev">‹</button>
        <button class="pv-arrow right" id="pv-arrow-next">›</button>
      </div>
      <div class="pv-actions" id="pv-actions"></div>
    </div>
  </div>
</div>
<div id="toast" hidden></div>

<!-- 新手教程（每个账号第一次自动弹出） -->
<div id="tutorial" hidden>
  <div class="tut-card">
    <div class="tut-emoji" id="tut-emoji">📍</div>
    <h2 id="tut-title"></h2>
    <p id="tut-text"></p>
    <div class="tut-dots" id="tut-dots"></div>
    <div class="tut-btns">
      <button id="tut-skip" class="tut-link">跳过教程</button>
      <button id="tut-next">下一步 →</button>
      <button id="tut-done" hidden>开始使用 ✓</button>
    </div>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
